name: Samsung Kalteng Operational Smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'ops-modules.js'
      - 'futuristic-ui.css'
      - 'tests/ui-regression.cjs'
      - 'tests/ops-smoke.cjs'
      - '.github/workflows/ops-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ops-modules.js'
      - 'futuristic-ui.css'
      - 'tests/ui-regression.cjs'
      - 'tests/ops-smoke.cjs'
      - '.github/workflows/ops-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify JavaScript and scoped operational views
        run: |
          node --version
          node tests/ops-smoke.cjs
          node tests/ui-regression.cjs
