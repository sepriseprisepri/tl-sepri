name: Password Recovery PostgreSQL Integration (Isolated)

on:
  pull_request:
    paths:
      - 'docs/sql/20261110-password-recovery-approval-draft.sql'
      - 'docs/sql/20261110-password-recovery-rls-guard-staging.sql'
      - 'docs/sql/20261110-password-recovery-restrictive-rls-staging.sql'
      - 'docs/sql/20261110-commit-master-database-recovery-guard-staging.sql'
      - 'tests/sql/**'
      - '.github/workflows/recovery-postgres-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testowner
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: recovery_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testowner -d recovery_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: testowner
      PGPASSWORD: local-ci-only
      PGDATABASE: recovery_tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
      - name: Apply draft SQL to new dummy database and assert RLS
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/sql/recovery-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/20261110-password-recovery-approval-draft.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/20261110-password-recovery-rls-guard-staging.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/20261110-password-recovery-restrictive-rls-staging.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/recovery-assertions.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/20261110-commit-master-database-recovery-guard-staging.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/recovery-master-commit-rpc-assertions.sql
      - name: Check 12 parallel requests allow only 5
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery-rate
          for i in $(seq 1 12); do
            (
              psql -v ON_ERROR_STOP=1 -tA -c "SET ROLE service_role; SELECT public.password_recovery_claim_rate(repeat('b',64));" > "/tmp/recovery-rate/$i"
            ) &
          done
          wait
          allowed=$(grep -hxc 't' /tmp/recovery-rate/* | awk '{s+=$1} END {print s+0}')
          denied=$(grep -hxc 'f' /tmp/recovery-rate/* | awk '{s+=$1} END {print s+0}')
          test "$allowed" -eq 5
          test "$denied" -eq 7
          echo "12 concurrent claims: 5 allowed, 7 denied — PASS"
