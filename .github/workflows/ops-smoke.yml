name: Samsung Kalteng Operational Smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'sales-intelligence.js'
      - 'market-metrics.js'
      - 'tests/market-metrics.cjs'
      - 'tests/market-chart-interactions.cjs'
      - 'promo-center.js'
      - 'tests/promo-master-20261106.cjs'
      - 'docs/sql/20261106-promo-provenance.sql'
      - 'docs/sql/20261106-promo-master-import.sql'
      - 'user-experience.js'
      - 'sales-intelligence.css'
      - 'tests/intelligence-smoke.cjs'
      - 'docs/sql/sales-intelligence-promotions-20261106.sql'
      - 'ops-modules.js'
      - 'focus-model-allocations.js'
      - 'tests/focus-model-ui.cjs'
      - 'futuristic-ui.css'
      - 'tests/ui-regression.cjs'
      - 'tests/ops-smoke.cjs'
      - 'password-recovery.js'
      - 'tests/password-recovery-smoke.cjs'
      - 'tests/password-recovery-mock-integration.cjs'
      - 'supabase/functions/password-recovery/**'
      - 'docs/sql/20261110-password-recovery-approval-draft.sql'
      - '.github/workflows/ops-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sales-intelligence.js'
      - 'market-metrics.js'
      - 'tests/market-metrics.cjs'
      - 'tests/market-chart-interactions.cjs'
      - 'promo-center.js'
      - 'tests/promo-master-20261106.cjs'
      - 'docs/sql/20261106-promo-provenance.sql'
      - 'docs/sql/20261106-promo-master-import.sql'
      - 'user-experience.js'
      - 'sales-intelligence.css'
      - 'tests/intelligence-smoke.cjs'
      - 'docs/sql/sales-intelligence-promotions-20261106.sql'
      - 'ops-modules.js'
      - 'focus-model-allocations.js'
      - 'tests/focus-model-ui.cjs'
      - 'futuristic-ui.css'
      - 'tests/ui-regression.cjs'
      - 'tests/ops-smoke.cjs'
      - 'password-recovery.js'
      - 'tests/password-recovery-smoke.cjs'
      - 'tests/password-recovery-mock-integration.cjs'
      - 'supabase/functions/password-recovery/**'
      - 'docs/sql/20261110-password-recovery-approval-draft.sql'
      - '.github/workflows/ops-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify JavaScript and scoped operational views
        run: |
          node --version
          node --check password-recovery.js
          node tests/password-recovery-smoke.cjs
          node tests/password-recovery-mock-integration.cjs
          node --check focus-model-allocations.js
          node tests/focus-model-ui.cjs
          node tests/market-metrics.cjs
          node tests/market-chart-interactions.cjs
          node tests/ops-smoke.cjs
          node tests/ui-regression.cjs
          node tests/intelligence-smoke.cjs
          node tests/promo-master-20261106.cjs
