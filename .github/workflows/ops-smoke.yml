name: Samsung Kalteng Operational Smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'sales-intelligence.js'
      - 'promo-center.js'
      - 'tests/promo-master-20261106.cjs'
      - 'docs/sql/20261106-promo-provenance.sql'
      - 'docs/sql/20261106-promo-master-import.sql'
      - 'user-experience.js'
      - 'sales-intelligence.css'
      - 'tests/intelligence-smoke.cjs'
      - 'docs/sql/sales-intelligence-promotions-20261106.sql'
      - 'ops-modules.js'
      - 'futuristic-ui.css'
      - 'tests/ui-regression.cjs'
      - 'tests/ops-smoke.cjs'
      - '.github/workflows/ops-smoke.yml'
      - 'staging-local/**'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sales-intelligence.js'
      - 'promo-center.js'
      - 'tests/promo-master-20261106.cjs'
      - 'docs/sql/20261106-promo-provenance.sql'
      - 'docs/sql/20261106-promo-master-import.sql'
      - 'user-experience.js'
      - 'sales-intelligence.css'
      - 'tests/intelligence-smoke.cjs'
      - 'docs/sql/sales-intelligence-promotions-20261106.sql'
      - 'ops-modules.js'
      - 'futuristic-ui.css'
      - 'tests/ui-regression.cjs'
      - 'tests/ops-smoke.cjs'
      - '.github/workflows/ops-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify JavaScript and scoped operational views
        run: |
          node --version
          node tests/ops-smoke.cjs
          node tests/ui-regression.cjs
          node tests/intelligence-smoke.cjs
          node tests/promo-master-20261106.cjs

      - name: Validate PowerShell staging scripts without running Docker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem 'staging-local' -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($_.Name + ': ' + ($parseErrors | Out-String)) }
            Write-Host ('Syntax OK: ' + $_.Name)
          }
