name: Samsung Kalteng Production Password Recovery Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-password-recovery-smoke.yml"
      - "index.html"
      - "password-recovery.js"
      - "supabase/functions/password-recovery/**"

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check production site and public Turnstile config
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 20 \
            https://samsung-kalteng.vercel.app/ -o /tmp/samsung-home.html
          grep -Fq '0x4AAAAAAF7X-UHoy8m2fpvy' /tmp/samsung-home.html
          grep -Fq '/password-recovery.js' /tmp/samsung-home.html
          curl --fail --silent --show-error --location --retry 3 --max-time 20 \
            https://samsung-kalteng.vercel.app/password-recovery.js -o /tmp/password-recovery.js
          grep -Fq 'SAMSUNG_TURNSTILE_SITE_KEY' /tmp/password-recovery.js
          echo "PASS: production HTML, recovery script and public sitekey available"

      - name: Check production Edge Function fails closed without touching users
        shell: bash
        run: |
          set -euo pipefail
          url="https://xirmqdcdqpocdfqqvxmh.supabase.co/functions/v1/password-recovery"
          status="$(curl --silent --show-error --max-time 25 -o /tmp/cors.json -w '%{http_code}' \
            -X OPTIONS -H 'Origin: https://samsung-kalteng.vercel.app' "$url")"
          test "$status" = "200" || { echo "FAIL: OPTIONS returned HTTP $status"; exit 1; }

          # The fake username and deliberately too-short CAPTCHA never reach
          # user lookup, database rate limiting, or Auth password reset.
          # HTTP 400 proves production runtime secrets exist and CAPTCHA
          # validation fails closed. HTTP 503 indicates missing configuration.
          status="$(curl --silent --show-error --max-time 25 -o /tmp/invalid-captcha.json -w '%{http_code}' \
            -H 'Origin: https://samsung-kalteng.vercel.app' \
            -H 'Content-Type: application/json' \
            --data '{"action":"request","employee_id":"CI_FAKE_9000000","reason":"forgot","captcha_token":"bad"}' \
            "$url")"
          test "$status" = "400" || { echo "FAIL: invalid CAPTCHA returned HTTP $status (expected 400)"; exit 1; }
          grep -Fq 'Verifikasi keamanan gagal' /tmp/invalid-captcha.json || {
            echo "FAIL: unexpected invalid-CAPTCHA response"; exit 1;
          }

          status="$(curl --silent --show-error --max-time 25 -o /tmp/unauthorized.json -w '%{http_code}' \
            -H 'Origin: https://samsung-kalteng.vercel.app' \
            -H 'Content-Type: application/json' \
            --data '{"action":"list"}' "$url")"
          test "$status" = "401" || { echo "FAIL: anonymous admin list returned HTTP $status"; exit 1; }
          echo "PASS: production Edge runtime configured, invalid CAPTCHA rejected, admin route unauthorized"

      - name: Ensure no production data was modified by test
        run: |
          echo "Tests submit only an invalid CAPTCHA and no valid JWT."
          echo "No approved request, authentication update, or reset is performed."
