name: Focus Model Real Supabase Local Auth and PostgREST E2E

on:
  pull_request:
    paths:
      - 'docs/sql/20261110-focus-ec-allocations-staging.sql'
      - 'tests/sql/focus-supabase-local-fixture.sql'
      - 'tests/focus-supabase-local-e2e.cjs'
      - '.github/workflows/focus-supabase-local-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-focus-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.81.3
      - name: Start disposable GoTrue/PostgREST/PostgreSQL locally
        run: |
          set -euo pipefail
          supabase --version
          supabase init --force
          supabase start -x studio,imgproxy,realtime,storage-api,postgres-meta,logflare,vector,supavisor,mailpit
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
      - name: Apply local-only app schema and proposed migration
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGDATABASE=postgres
          psql -v ON_ERROR_STOP=1 -f tests/sql/focus-supabase-local-fixture.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/20261110-focus-ec-allocations-staging.sql
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          # Only expose LOCAL runtime's credentials to the next step.
          supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|API_URL)=' | sed -E 's/^([^=]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
          sleep 3
      - name: Verify actual Auth JWT and PostgREST RLS/atomic RPC
        run: |
          node --check tests/focus-supabase-local-e2e.cjs
          node tests/focus-supabase-local-e2e.cjs
      - name: Cleanup ephemeral Supabase
        if: always()
        run: |
          supabase stop --no-backup || true
