name: TL AI quota isolated PostgreSQL
on:
  pull_request:
    paths:
      - 'docs/sql/20261114-tl-ai-insight-quota-DRAFT.sql'
      - 'tests/sql/tl-ai-quota-assertions.sql'
      - '.github/workflows/tl-ai-insight-postgres.yml'
permissions:
  contents: read
jobs:
  quota:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testowner
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: quota_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testowner -d quota_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: testowner
      PGPASSWORD: local-ci-only
      PGDATABASE: quota_tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test quota on disposable database
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/focus-allocations-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/20261114-tl-ai-insight-quota-DRAFT.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/tl-ai-quota-assertions.sql
      - name: Verify simultaneous requests cannot exceed the limit
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "DELETE FROM ai_insights_private.daily_quota WHERE profile_id='22222222-2222-2222-2222-222222222222';"
          pids=()
          for i in $(seq 1 30); do
            psql -v ON_ERROR_STOP=1 -q -c "SET ROLE authenticated; SELECT set_config('request.jwt.claim.sub','22222222-2222-2222-2222-222222222222',false); SELECT public.claim_tl_ai_insight_quota();" >/dev/null &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          count=$(psql -v ON_ERROR_STOP=1 -At -c "SELECT requests FROM ai_insights_private.daily_quota WHERE profile_id='22222222-2222-2222-2222-222222222222';")
          test "$count" = 20
      - name: Exercise API through real PostgREST and RLS fixture
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "DELETE FROM ai_insights_private.daily_quota;"
          psql -v ON_ERROR_STOP=1 -f tests/sql/tl-ai-postgrest-fixture.sql
          docker run -d --name tl-ai-postgrest --network host \
            -e PGRST_DB_URI='postgres://web_authenticator:integration-test-only@127.0.0.1:5432/quota_tests' \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET='integration-only-secret-32-chars-long-12345' \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 2
          done
          POSTGREST_URL=http://127.0.0.1:3000 node tests/tl-ai-postgrest-integration.cjs
